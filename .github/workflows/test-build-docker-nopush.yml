---
name: Test Docker build without push

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: redjax/pipelinetemplates-test-app1

jobs:
  build-only:
    name: Build app1 without publishing
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Build app1 without publishing
        uses: redjax/PipelineTemplates/.github/actions/docker-build-publish@feat/docker-gh-publish
        with:
          context: containers/app1
          dockerfile: containers/app1/Dockerfile
          image_name: ${{ env.IMAGE_NAME }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:run-${{ github.run_id }}
          push: "false"
          platforms: linux/amd64
          build_args: |
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.run_id }}
          cache_from: ""
          cache_to: ""
          registry: ${{ env.REGISTRY }}
          registry_username: ${{ github.actor }}
          registry_password: ${{ secrets.GITHUB_TOKEN }}
