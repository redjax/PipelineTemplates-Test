---
name: Test Docker matrix build

on:
  workflow_dispatch:
    inputs:
      push:
        description: Push images to GHCR
        required: false
        type: boolean
        default: true

      platforms:
        description: Comma-separated target platforms
        required: false
        type: string
        default: linux/amd64,linux/arm64

      no_cache:
        description: Disable Docker build cache
        required: false
        type: boolean
        default: false

      target:
        description: Optional Dockerfile build target
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  build-matrix:
    name: Build Docker matrix

    permissions:
      contents: read
      packages: write

    uses: redjax/PipelineTemplates/.github/workflows/docker-build-matrix.yml@feat/docker-gh-publish
    with:
      publish: ${{ inputs.push }}
      ## Define build matrix to send to central pipeline.
      #  The difficult parsing is handled centrally, you only need
      #  to provide JSON objects telling it how to build.
      matrix: |
        [
          {
            "name": "app1",
            "context": "containers/app1",
            "dockerfile": "containers/app1/Dockerfile",
            "platforms": "${{ inputs.platforms }}",
            "registry": "ghcr.io",
            "registry_username": "${{ github.actor }}",
            "tags": "ghcr.io/redjax/pipelinetemplates-test-app1:run-${{ github.run_id }}\nghcr.io/redjax/pipelinetemplates-test-app1:latest",
            "build_args": "GIT_SHA=${{ github.sha }}\nBUILD_DATE=${{ github.run_id }}",
            "labels": "org.opencontainers.image.source=https://github.com/${{ github.repository }}\norg.opencontainers.image.revision=${{ github.sha }}",
            "target": "${{ inputs.target }}",
            "pull": true,
            "no_cache": ${{ toJSON(inputs.no_cache) }},
            "cache_from": "type=gha,scope=pipelinetemplates-test-app1",
            "cache_to": "type=gha,mode=max,scope=pipelinetemplates-test-app1",
            "secrets": "",
            "outputs": "",
            "annotations": "",
            "publish": ${{ toJSON(inputs.push) }}
          },
          {
            "name": "app2",
            "context": "containers/app2",
            "dockerfile": "containers/app2/Dockerfile",
            "platforms": "${{ inputs.platforms }}",
            "registry": "ghcr.io",
            "registry_username": "${{ github.actor }}",
            "tags": "ghcr.io/redjax/pipelinetemplates-test-app2:run-${{ github.run_id }}\nghcr.io/redjax/pipelinetemplates-test-app2:latest",
            "build_args": "GIT_SHA=${{ github.sha }}\nBUILD_DATE=${{ github.run_id }}",
            "labels": "org.opencontainers.image.source=https://github.com/${{ github.repository }}\norg.opencontainers.image.revision=${{ github.sha }}",
            "target": "${{ inputs.target }}",
            "pull": true,
            "no_cache": ${{ toJSON(inputs.no_cache) }},
            "cache_from": "type=gha,scope=pipelinetemplates-test-app2",
            "cache_to": "type=gha,mode=max,scope=pipelinetemplates-test-app2",
            "secrets": "",
            "outputs": "",
            "annotations": "",
            "publish": ${{ toJSON(inputs.push) }}
          }
        ]
    secrets:
      registry-token: ${{ secrets.GITHUB_TOKEN }}
