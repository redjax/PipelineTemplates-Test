---
#################################################################################
# Validate the centralized ShellCheck reusable workflow                         #
#                                                                               #
# Fixture expectations:                                                         #
#   - valid:   Reports zero ShellCheck findings and succeeds.                   #
#   - finding: Reports one or more intentional ShellCheck findings but succeeds #
#              because fail-on-findings is disabled for the test fixture.       #
#################################################################################

name: Test ShellCheck

on:
  # pull_request:
  #   paths:
  #     - ".github/workflows/test-shellcheck.yml"
  #     - "tests/shell-quality/**"

  push:
    branches:
      - feat/test-shellcheck-shellfmt
    paths:
      - ".github/workflows/test-shellcheck.yml"
      - "tests/shell-quality/**"

  workflow_dispatch:
    inputs:
      pipelinetemplates-ref:
        description: >-
          PipelineTemplates branch, tag, or commit SHA containing the ShellCheck
          workflow, shared scripts, and central configuration.
        required: false
        type: string
        default: feat/gh-shellcheck-shellfmt

permissions:
  actions: read
  contents: read

jobs:
  valid:
    name: ShellCheck valid fixture
    uses: redjax/PipelineTemplates/.github/workflows/shellcheck.yml@feat/gh-shellcheck-shellfmt
    with:
      pipelinetemplates-ref: ${{ inputs.pipelinetemplates-ref || 'feat/gh-shellcheck-shellfmt' }}
      scan-path: tests/shell-quality/valid
      fail-on-findings: true
      artifact-name: test-shellcheck-valid-results
      artifact-retention-days: 7

  finding:
    name: ShellCheck intentional finding
    uses: redjax/PipelineTemplates/.github/workflows/shellcheck.yml@feat/gh-shellcheck-shellfmt
    with:
      pipelinetemplates-ref: ${{ inputs.pipelinetemplates-ref || 'feat/gh-shellcheck-shellfmt' }}
      scan-path: tests/shell-quality/shellcheck

      ## The fixture intentionally contains an unquoted variable expansion.
      #  Keep the reusable-workflow job successful so this test can inspect its
      #  generated report artifact.
      fail-on-findings: false

      artifact-name: test-shellcheck-finding-results
      artifact-retention-days: 7

  verify:
    name: Verify ShellCheck reports
    if: ${{ always() && needs.valid.result == 'success' && needs.finding.result == 'success' }}
    needs:
      - valid
      - finding
    runs-on: ubuntu-latest

    steps:
      - name: Download valid-fixture report
        uses: actions/download-artifact@v4
        with:
          name: test-shellcheck-valid-results
          path: artifacts/valid

      - name: Download finding-fixture report
        uses: actions/download-artifact@v4
        with:
          name: test-shellcheck-finding-results
          path: artifacts/finding

      - name: Verify ShellCheck expectations
        shell: bash
        run: |
          set -euo pipefail

          valid_report="$(
            find artifacts/valid \
              -type f \
              -name shellcheck.txt \
              -print \
              -quit
          )"

          finding_report="$(
            find artifacts/finding \
              -type f \
              -name shellcheck.txt \
              -print \
              -quit
          )"

          if [[ -z "${valid_report}" ]]; then
            echo "::error title=Missing ShellCheck report::The valid fixture report was not downloaded."
            exit 1
          fi

          if [[ -z "${finding_report}" ]]; then
            echo "::error title=Missing ShellCheck report::The intentional finding fixture report was not downloaded."
            exit 1
          fi

          if grep --quiet --extended-regexp 'SC[0-9]+' "${valid_report}"; then
            echo "::error title=Unexpected ShellCheck findings::The valid fixture produced ShellCheck findings."
            cat "${valid_report}"
            exit 1
          fi

          if ! grep --quiet --extended-regexp 'SC[0-9]+' "${finding_report}"; then
            echo "::error title=Missing ShellCheck finding::The intentional finding fixture did not produce a ShellCheck diagnostic."
            cat "${finding_report}"
            exit 1
          fi

          echo "ShellCheck fixture expectations passed."
