---
#############################################################################
# Validate the centralized shellfmt reusable workflow                       #
#                                                                           #
# Fixture expectations:                                                     #
#   - valid:   Produces an empty shellfmt diff and succeeds.                #
#   - finding: Produces a shellfmt diff containing one or more differences. #
#############################################################################

name: Test shellfmt

on:
  # pull_request:
  #   paths:
  #     - ".github/workflows/test-shellfmt.yml"
  #     - "tests/shell-quality/**"

  push:
    branches:
      - feat/test-shellcheck-shellfmt
    paths:
      - ".github/workflows/test-shellfmt.yml"
      - "tests/shell-quality/**"

  workflow_dispatch:
    inputs:
      pipelinetemplates-ref:
        description: >-
          PipelineTemplates branch, tag, or commit SHA containing the shellfmt
          workflow, shared scripts, and central configuration.
        required: false
        type: string
        default: feat/gh-shellcheck-shellfmt

permissions:
  actions: read
  contents: read

jobs:
  valid:
    name: shellfmt valid fixture
    uses: redjax/PipelineTemplates/.github/workflows/shellfmt.yml@feat/gh-shellcheck-shellfmt
    with:
      pipelinetemplates-ref: ${{ inputs.pipelinetemplates-ref || 'feat/gh-shellcheck-shellfmt' }}
      scan-path: tests/shell-quality/valid
      fail-on-findings: true
      artifact-name: test-shellfmt-valid-results
      artifact-retention-days: 7

  finding:
    name: shellfmt intentional finding
    uses: redjax/PipelineTemplates/.github/workflows/shellfmt.yml@feat/gh-shellcheck-shellfmt
    with:
      pipelinetemplates-ref: ${{ inputs.pipelinetemplates-ref || 'feat/gh-shellcheck-shellfmt' }}
      scan-path: tests/shell-quality/shellfmt

      ## The fixture intentionally violates central shellfmt options.
      #  Keep the reusable-workflow job successful so this test can inspect its
      #  generated diff artifact.
      fail-on-findings: false

      artifact-name: test-shellfmt-finding-results
      artifact-retention-days: 7

  verify:
    name: Verify shellfmt reports
    if: ${{ always() && needs.valid.result == 'success' && needs.finding.result == 'success' }}
    needs:
      - valid
      - finding
    runs-on: ubuntu-latest

    steps:
      - name: Download valid-fixture report
        uses: actions/download-artifact@v4
        with:
          name: test-shellfmt-valid-results
          path: artifacts/valid

      - name: Download finding-fixture report
        uses: actions/download-artifact@v4
        with:
          name: test-shellfmt-finding-results
          path: artifacts/finding

      - name: Verify shellfmt expectations
        shell: bash
        run: |
          set -euo pipefail

          valid_report="$(
            find artifacts/valid \
              -type f \
              -name shellfmt.diff \
              -print \
              -quit
          )"

          finding_report="$(
            find artifacts/finding \
              -type f \
              -name shellfmt.diff \
              -print \
              -quit
          )"

          if [[ -z "${valid_report}" ]]; then
            echo "::error title=Missing shellfmt report::The valid fixture report was not downloaded."
            exit 1
          fi

          if [[ -z "${finding_report}" ]]; then
            echo "::error title=Missing shellfmt report::The intentional finding fixture report was not downloaded."
            exit 1
          fi

          if [[ -s "${valid_report}" ]]; then
            echo "::error title=Unexpected shellfmt differences::The valid fixture produced formatting differences."
            cat "${valid_report}"
            exit 1
          fi

          if [[ ! -s "${finding_report}" ]]; then
            echo "::error title=Missing shellfmt difference::The intentional finding fixture produced no formatting diff."
            exit 1
          fi

          echo "shellfmt fixture expectations passed."
