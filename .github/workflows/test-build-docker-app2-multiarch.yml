---
name: Test Docker multi-arch build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Base image tag to use
        required: false
        type: string
        default: latest

      platforms:
        description: Comma-separated target platforms
        required: false
        type: string
        default: linux/amd64,linux/arm64

      push:
        description: Push image to registry
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    name: Build app2 multi-arch image

    permissions:
      contents: read
      packages: write

    uses: redjax/PipelineTemplates/.github/workflows/docker-build-publish.yml@feat/docker-gh-publish
    with:
      context: containers/app2
      dockerfile: containers/app2/Dockerfile
      image: ghcr.io/redjax/pipelinetemplates-test-app2
      tags: |
        ghcr.io/redjax/pipelinetemplates-test-app2:${{ inputs.tag }}
        ghcr.io/redjax/pipelinetemplates-test-app2:sha-${{ github.sha }}
        ghcr.io/redjax/pipelinetemplates-test-app2:run-${{ github.run_id }}
      platforms: ${{ inputs.platforms }}
      build_args: |
        GIT_SHA=${{ github.sha }}
        BUILD_DATE=${{ github.run_id }}
      labels: |
        org.opencontainers.image.source=https://github.com/${{ github.repository }}
        org.opencontainers.image.revision=${{ github.sha }}
      pull: true
      no_cache: false
      cache_from: type=gha,scope=pipelinetemplates-test-app2
      cache_to: type=gha,mode=max,scope=pipelinetemplates-test-app2
      secrets: ""
      outputs: ""
      annotations: ""
      publish: ${{ inputs.push }}
    secrets:
      registry-token: ${{ secrets.GITHUB_TOKEN }}
